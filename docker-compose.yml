services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Forwarded from the host shell by NAME only; values are never written into
      # this file or the image. A shell value overrides the same key in .env.
      # Credentials:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      # Region. The app applies the documented precedence itself:
      # MEL_BEDROCK_REGION, then AWS_REGION, then AWS_DEFAULT_REGION (empty = unset).
      - MEL_BEDROCK_REGION
      - AWS_REGION
      - AWS_DEFAULT_REGION
    volumes:
      - ../mel-survey-agent-participant-pack/participant-pack:/data/participant-pack:ro
      - ./var:/app/var
