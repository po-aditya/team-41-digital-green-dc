[project]
name = "farmerloop"
version = "0.1.0"
description = "FarmerLoop Intelligence - MEL survey agent for Digital Green FarmerChat (Milestone 1: deterministic foundation)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.21",
    "referencing>=0.34",
    "boto3>=1.34",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.45,<2",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
farmerloop-demo = "farmerloop.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/farmerloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
